version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Next.js 14 Web Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transmuteai-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - transmuteai-network

  # ----------------------------------------------------------------------------
  # FastAPI Backend API Server
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transmuteai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - EXECUTION_MODE=celery
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AIR_GAPPED_MODE=${AIR_GAPPED_MODE:-false}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/transmuteai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - postgres
      - redis
    networks:
      - transmuteai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Distributed Celery Async Worker
  # ----------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transmuteai-celery-worker
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    volumes:
      - ./storage:/app/storage
    environment:
      - ENVIRONMENT=production
      - EXECUTION_MODE=celery
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AIR_GAPPED_MODE=${AIR_GAPPED_MODE:-false}
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/transmuteai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - postgres
    networks:
      - transmuteai-network

  # ----------------------------------------------------------------------------
  # Redis (Broker & Cache)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: transmuteai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - transmuteai-network

  # ----------------------------------------------------------------------------
  # PostgreSQL (Database & Provenance Ledger)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: transmuteai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transmuteai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transmuteai-network

  # ----------------------------------------------------------------------------
  # Ollama Local LLM Runner (Air-Gapped Mode)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: transmuteai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - transmuteai-network

volumes:
  redis_data:
  postgres_data:
  ollama_models:

networks:
  transmuteai-network:
    driver: bridge
